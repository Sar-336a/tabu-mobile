name: Tabu Mobil APK Derleme

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: NPM Paketlerini Yükle
        working-directory: react-native-tabu
        run: npm install

      - name: JavaScript Paketini Derle (Pre-bundle JS)
        working-directory: react-native-tabu
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/
          ls -la android/app/src/main/assets/

      - name: Gradle ile APK Derle
        working-directory: react-native-tabu/android
        run: |
          chmod +x gradlew
          echo "Derleme baslatiliyor: assembleDebug..."
          ./gradlew assembleDebug --stacktrace --no-daemon > gradle_build.log 2>&1 || true
          FOUND_APK=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            echo "APK basariyla uretildi: $FOUND_APK"
          else
            echo "HATA: APK uretilemedi!"
            tail -n 40 gradle_build.log
            FAILED_TASKS=$(grep "FAILED" gradle_build.log | head -n 5 | tr '\n' ' ' | tr -d '"')
            echo "::error title=FailedTasks::$FAILED_TASKS"
            WHAT_WRONG=$(grep -A 8 "What went wrong:" gradle_build.log | head -n 8 | tr '\n' ' ' | tr -d '"')
            echo "::error title=WhatWentWrong::$WHAT_WRONG"
            exit 1
          fi

      - name: Derleme Logunu Artifact Olarak Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: react-native-tabu/android/gradle_build.log

      - name: APK Dosyasını İsimlendir ve Taşı
        run: |
          mkdir -p build-output
          APK_FILE=$(find react-native-tabu/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Bulunan APK: $APK_FILE"
            cp "$APK_FILE" build-output/TabuMobil-v1.0.0.apk
          else
            echo "Hata: Hiçbir APK üretilemedi!"
            exit 1
          fi
          ls -la build-output/

      - name: APK'yı GitHub Actions Çıktısı (Artifact) Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: TabuMobil-v1.0.0-APK
          path: build-output/TabuMobil-v1.0.0.apk

      - name: GitHub Release Olarak Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Tabu Mobil Pro v1.0.0 (APK)"
          body: |
            ### 📱 Tabu Mobil Pro - Android APK
            Bu APK dosyası GitHub Actions tarafından derlenmiştir.
            
            1. Aşağıdaki **TabuMobil-v1.0.0.apk** dosyasına tıklayarak doğrudan telefonunuza indirin.
            2. Telefonunuzda indirdiğiniz APK dosyasına dokunup kurulumu tamamlayın.
            3. Keyifli oyunlar!
          files: build-output/TabuMobil-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
